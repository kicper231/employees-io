spring.application.name=employees-api
spring.datasource.url=jdbc:postgresql://${AWS_RDS_DATABASE_HOST}:5432/${AWS_RDS_DATABASE}?useSSL=false\
  &allowPublicKeyRetrieval=true&autoReconnect=true
spring.datasource.username=${AWS_RDS_DATABASE_USERNAME}
spring.datasource.password=${AWS_RDS_DATABASE_PASSWORD}

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.liquibase.change-log=db/changelog/changelog-master.xml

spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false