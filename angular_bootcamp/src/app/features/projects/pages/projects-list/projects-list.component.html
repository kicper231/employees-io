<div class="menu">
  <app-basic-button class="employees__button" (clickEvent)="goBack()">
    <mat-icon>keyboard_backspace</mat-icon>
  </app-basic-button>

  <mat-form-field appearance="outline">
    <mat-label>Wyszukaj projekt</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Nazwa projektu" type="text" />
  </mat-form-field>

  <app-basic-button>Dodaj projekt</app-basic-button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Ids.</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let element">{{ element.description }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    routerLinkActive
    *matRowDef="let row; columns: displayedColumns"
    [routerLink]="['/projects', row.id]"
  ></tr>
</table>
