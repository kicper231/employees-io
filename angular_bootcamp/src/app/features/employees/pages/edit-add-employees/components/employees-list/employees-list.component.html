<mat-card appearance="outlined">
  <mat-card-header class="employees-list__header">{{ "employees.list.title" | translate }}</mat-card-header>
  <mat-card-content>
    <mat-selection-list #shoes [multiple]="false" [hideSingleSelectionIndicator]="true">
      @for (employee of listOfEmployees; track employee) {
        <mat-list-option
          [value]="employee"
          (click)="onSelect(employee)"
          [class.employees-list__button--selected]="employee.id === selectedEmployee?.id!"
        >
          <span class="employees-list__button__name-surname">{{ employee.name }} {{ employee.surname }}</span>
        </mat-list-option>
      }
      <!--      //TODO dodaj zmiane koloru przy kliknieciu-->
    </mat-selection-list>
  </mat-card-content>
  <mat-card-footer>
    <div class="employees-list__buttons-group">
      <button mat-mini-fab class="employees-list__button-list" type="button" (click)="deleteEmployee()">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-mini-fab class="employees-list__button-list" type="button" (click)="addEmployee()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </mat-card-footer>
</mat-card>
