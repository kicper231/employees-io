<h2 mat-dialog-title>{{ "dialog.delete.confirmation.title" | translate }}</h2>
<mat-dialog-content>{{ "dialog.delete.confirmation.content" | translate }}</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>{{ "dialog.delete.confirmation.no" | translate }}</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>
    {{ "dialog.delete.confirmation.yes" | translate }}
  </button>
</mat-dialog-actions>
