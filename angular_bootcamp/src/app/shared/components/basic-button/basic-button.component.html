<button
  [ngClass]="{
    'basic-button--big': fullWidth,
    'basic-button': true,
    'basic-button--delete': isDelete,
    'basic-button--small': isSmall,
    'basic-button--active': isRouterLinkActive,
    'basic-button--header': isHeader,
  }"
  mat-button
  [type]="type"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>
