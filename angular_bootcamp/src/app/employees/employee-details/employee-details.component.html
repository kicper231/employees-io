@if (employee) {
  <div class="profile-info">
    <h2 class="profile-info_title">Employee profile info</h2>
    <div class="profile-info__tile">
      <label for="name" class="profile-info__tile-label"> name: </label>
      <input id="name" class="profile-info__tile-input" type="text" [(ngModel)]="employee.name" placeholder="name" />
      {{ employee.name | uppercase }}
    </div>

    <div class="profile-info__tile">
      <label for="surname" class="profile-info__tile-label"> surname: </label>
      <input
        id="surname"
        class="profile-info__tile-input"
        type="text"
        [(ngModel)]="employee.surname"
        placeholder="surname"
      />
      {{ employee.surname }}
    </div>
    <div class="profile-info__tile">
      <label for="hire-date" class="profile-info__tile-label"> Date of hire: </label>
      <input
        id="hire-date"
        class="profile-info__tile-input"
        [ngModel]="employee.hireDate | date: 'medium'"
        placeholder="hireDate"
        disabled
      />
      {{ employee.hireDate | date: 'medium' }}
    </div>
  </div>

  <div class="profile-info__tile">
    <app-employee-details-skills [employee]="employee"></app-employee-details-skills>
  </div>

  <div class="profile-info__tile">
    <app-employee-details-projects [employee]="employee"></app-employee-details-projects>
  </div>

  <div class="profile-info__tile">
    <span> Manager: </span>
    <span class="profile-info__tile-input"> {{ getManagerFullName() }}</span>
  </div>
}
