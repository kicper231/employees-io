<div class="projects-tile"></div>
<span class="projects-tile__title">Projects:</span>
<ul class="projects-tile__list">
  @for (project of employee.projectsList; track project.name) {
    <li class="projects-tile__list-element">
      <span class="list-element__name">{{ project.name }}</span>
      <span class="list-element__description">{{ project.description }}</span>
      <span class="list-element__technologies">{{ project.technologies }}</span>
    </li>
  }
</ul>
