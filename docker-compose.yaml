version: '3.8'
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=employees'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=kacper231'
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./employees-api
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/employees'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=kacper231'
    depends_on:
      - postgres
  frontend:
    build:
      context: ./angular_bootcamp
      dockerfile: Dockerfile
    ports:
      - '4200:80'
    environment:
      - 'API_URL=http://backend:8080'
    depends_on:
      - backend
